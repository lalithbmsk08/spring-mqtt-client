version: 0.2

phases:
  pre_build:
    commands:
      - mvn clean install
      - echo Logging into Amazon ECR
      - aws --version
      - REPOSITORY_URI=202533503365.dkr.ecr.eu-west-2.amazonaws.com
      - aws ecr get-login-password --region eu-west-2 | docker login --username AWS --password-stdin 202533503365.dkr.ecr.eu-west-2.amazonaws.com
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=build-$(echo $CODEBUILD_BUILD_ID | awk -F":" '{print $2}')
  build:
    commands:
      - echo Build started on 'date'     
      - ls -la target
      - find target -name "*.jar"
      - docker build -t bentely-mdk-mqtt-registry .
      - echo Building the Docker Image..
      - docker tag bentely-mdk-mqtt-registry:latest 202533503365.dkr.ecr.eu-west-2.amazonaws.com/bentely-mdk-mqtt-registry:latest
  post_build:
    commands:
      - echo Build completed on 'date'
      - echo Pushing the Docker images..
      - docker push 202533503365.dkr.ecr.eu-west-2.amazonaws.com/bentely-mdk-mqtt-registry
      - echo Writing image definitions file..
      - printf '[{"name":"spring-mqtt-client","imageUri":"%s"}]' $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json
      - cat imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
    - target/spring-mqtt-client.jar
        
